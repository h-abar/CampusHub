services:
  postgres:
    image: postgres:16-alpine
    container_name: campushub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campushub
    ports:
      - "5432:5432"
    volumes:
      - campushub-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campushub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campushub-pgdata:
